name: Character Hub package
on: [push, pull_request, workflow_dispatch]
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: character-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: azerothcore-character-hub-v0.1.0
          path: |
            character-hub/dist/azerothcore-character-hub-v0.1.0.zip
            character-hub/dist/azerothcore-character-hub-v0.1.0.zip.sha256
